[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-flower-noise-mismatch"
version = "1.0.0"
description = "Paired robustness benchmark for FLOWER under misspecified Gaussian measurement-noise scale"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Itay Shorian"}]
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy>=1.26",
  "Pillow>=10.0",
  "scikit-image>=0.24",
  "pytorch-ignite>=0.5",
  "matplotlib>=3.9",
  "lpips>=0.1.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["robust_flower*", "pnpflow*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
